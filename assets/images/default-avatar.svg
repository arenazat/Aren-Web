<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(37, 99, 235, 0.08)" stroke-width="1"/>
    </pattern>

    <!-- Head & Body Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Orbit Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#avatarBg)"/>
  <rect width="400" height="500" fill="url(#grid)"/>

  <!-- Celestial Coordinate Rings in Background -->
  <circle cx="200" cy="210" r="160" fill="none" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="200" cy="210" r="120" fill="none" stroke="rgba(79, 70, 229, 0.2)" stroke-width="1"/>
  <ellipse cx="200" cy="210" rx="170" ry="60" fill="none" stroke="rgba(37, 99, 235, 0.25)" stroke-width="1.5" transform="rotate(-25 200 210)"/>

  <!-- Orbiting Node -->
  <circle cx="340" cy="150" r="6" fill="#2563EB" filter="url(#glow)"/>
  <circle cx="65" cy="260" r="4" fill="#6366F1"/>

  <!-- Silhouette / Stylized Portrait -->
  <g id="figure" transform="translate(0, 30)">
    <!-- Shoulders / Torso -->
    <path d="M 90 470 C 90 370, 140 330, 200 330 C 260 330, 310 370, 310 470 Z" fill="url(#bodyGrad)"/>
    
    <!-- Collar / Shirt Detail -->
    <path d="M 175 330 L 200 370 L 225 330 Z" fill="#FFFFFF"/>

    <!-- Neck -->
    <rect x="180" y="270" width="40" height="70" rx="10" fill="#F87171" opacity="0.85"/>

    <!-- Head Shape -->
    <ellipse cx="200" cy="210" rx="55" ry="70" fill="#F87171" opacity="0.9"/>

    <!-- Modern Hair Silhouette -->
    <path d="M 140 190 C 135 140, 170 120, 210 120 C 255 120, 265 145, 265 180 C 265 185, 255 180, 250 170 C 235 150, 170 155, 155 190 Z" fill="url(#hairGrad)"/>
    <path d="M 145 170 C 150 135, 195 130, 240 140 C 220 130, 175 130, 145 170 Z" fill="#334155"/>

    <!-- Minimalist Glasses (Intellectual / Academic Look) -->
    <rect x="155" y="195" width="38" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="3.5"/>
    <rect x="207" y="195" width="38" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="3.5"/>
    <line x1="193" y1="208" x2="207" y2="208" stroke="#0F172A" stroke-width="3.5"/>

    <!-- Modern Academic Badge Overlay -->
    <g transform="translate(145, 400)">
      <rect width="110" height="30" rx="15" fill="rgba(255, 255, 255, 0.95)" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="18" cy="15" r="6" fill="#2563EB"/>
      <text x="32" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0F172A">AREN AZAT</text>
    </g>
  </g>
</svg>
